services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: barbershop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barbershop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: barber
      DB_PASS: secret
      DB_NAME: barbershop
      WS_ORIGIN_ALLOWED: "*"
      JWT_SECRET: barberku-secret-key-change-in-production
      FCM_CREDENTIAL_PATH: /root/firebase-credentials.json
      FCM_PROJECT_ID: barberku-notif
    volumes:
      - ./firebase-credentials.json:/root/firebase-credentials.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
